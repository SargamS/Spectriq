# Local development stack: FastAPI app (which also runs the processing
# pipeline in-process on a background thread - see app/background.py)
# + Postgres. No separate worker or Redis needed anymore.
version: "3.9"

services:
  postgres:
    # pgvector/pgvector ships the `vector` extension pre-installed on top
    # of standard Postgres - needed for the "chat with meeting" embeddings.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spectriq
      POSTGRES_PASSWORD: spectriq
      POSTGRES_DB: spectriq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectriq"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://spectriq:spectriq@postgres:5432/spectriq
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  media_storage:
