# Local development stack: FastAPI app + Celery worker + Postgres + Redis.
# For production, deploy the `api` and `worker` images separately (e.g.
# Render/Railway web service + background worker) pointing at managed
# Postgres/Redis instances.
version: "3.9"

services:
  postgres:
    # pgvector/pgvector ships the `vector` extension pre-installed on top
    # of standard Postgres - needed for the "chat with meeting" embeddings.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spectriq
      POSTGRES_PASSWORD: spectriq
      POSTGRES_DB: spectriq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectriq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://spectriq:spectriq@postgres:5432/spectriq
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_worker worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://spectriq:spectriq@postgres:5432/spectriq
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    volumes:
      - .:/code
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_storage:
